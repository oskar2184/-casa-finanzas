<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Casa Finanzas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:1050px;margin:auto;padding:16px 14px 88px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-size:24px;font-weight:850}.muted{color:#667085;font-size:13px}.month{color:#667085;font-size:14px;margin-top:2px}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#111827;color:#fff}.blue{background:#2563eb;color:#fff}.ghost{background:#fff;border:1px solid #e1e5eb}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.section{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 2px 10px #10182808}.card{padding:16px}.label{font-size:13px;color:#667085}.value{font-size:27px;font-weight:850;margin-top:5px}.red{color:#dc2626}.green{color:#16a34a}.blueText{color:#2563eb}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.section{padding:16px}h2{font-size:17px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f3}.row:last-child{border-bottom:0}
.bar{height:9px;background:#eef1f5;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#2563eb;border-radius:99px}.bar.redbar i{background:#dc2626}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.forecast{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.monthbox{border:1px solid #e5e7eb;border-radius:14px;padding:10px}.small{font-size:12px;color:#667085}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding:8px 12px;z-index:5}.bottomin{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav{background:transparent;color:#667085}.nav.active{background:#eef4ff;color:#2563eb}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:650px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}input,select{width:100%;padding:13px;border:1px solid #d8dde6;border-radius:12px;font-size:16px;background:#fff}
.welcome{min-height:72vh;display:grid;place-items:center}.welcomeCard{max-width:520px;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 4px 18px #1018280a}.welcomeCard h1{font-size:30px;margin:0 0 8px}.welcomeCard p{color:#667085;line-height:1.5}.welcomeCard button{width:100%;margin-top:8px}
.toast{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;z-index:30}
@media(max-width:780px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.forecast{grid-template-columns:repeat(2,1fr)}.brand{font-size:21px}.value{font-size:24px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div><div class="app" id="app"></div>

<div class="modal" id="expenseModal" onclick="if(event.target===this)closeExpense()"><div class="sheet">
<div style="display:flex;justify-content:space-between;align-items:center"><h2>Registrar gasto</h2><button class="ghost" onclick="closeExpense()">Cerrar</button></div>
<div class="field"><label>Cuenta</label><select id="account" onchange="fillCats()"><option>Casa</option><option>Cornellà</option></select></div>
<div class="field"><label>Importe</label><input id="amount" type="number" inputmode="decimal" step=".01" placeholder="0,00"></div>
<div class="field"><label>Categoría</label><select id="category"></select></div>
<div class="field"><label>Nota (opcional)</label><input id="note" placeholder="Ej. compra semanal"></div>
<button class="blue" style="width:100%" onclick="saveExpense()">Guardar gasto</button>
</div></div>

<div class="modal" id="setupModal"><div class="sheet">
<h2>Configura tu casa</h2>
<div class="field"><label>Tu nombre</label><input id="userName" placeholder="Ej. Oscar"></div>
<div class="field"><label>Ingreso mensual principal</label><input id="mainIncome" type="number" placeholder="0"></div>
<div class="field"><label>Otros ingresos mensuales</label><input id="otherIncome" type="number" placeholder="0"></div>
<p class="small">Después podrás editar categorías, importes y pagos anuales.</p>
<button class="blue" style="width:100%" onclick="finishSetup()">Empezar</button>
</div></div>

<script>
const KEY="casaFinanzasUsuariosV1";
const defaults={name:"",homeIncome:[{name:"Ingreso principal",amount:0},{name:"Otros ingresos",amount:0}],homeExpenses:[
{name:"Vivienda",amount:0},{name:"Luz",amount:0},{name:"Agua",amount:0},{name:"Internet",amount:0},
{name:"Coche",amount:0},{name:"Comida",amount:0},{name:"Gasolina",amount:0},{name:"Restaurantes",amount:0},{name:"Compras",amount:0}],
apartmentIncome:[{name:"Alquiler",amount:0}],apartmentExpenses:[{name:"Hipoteca",amount:0},{name:"Comunidad",amount:0}],
movements:[],selectedMonth:new Date().toISOString().slice(0,7)};

let users=JSON.parse(localStorage.getItem(KEY)||"[]"), current=users[0]||null;
function save(){localStorage.setItem(KEY,JSON.stringify(users));render()}
function eur(n){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0)}
function monthLabel(k){let [y,m]=k.split("-");return new Intl.DateTimeFormat("es-ES",{month:"long",year:"numeric"}).format(new Date(+y,+m-1,1)).replace(/^./,c=>c.toUpperCase())}
function cats(){return (document.getElementById("account").value==="Casa"?current.homeExpenses:current.apartmentExpenses).map(x=>x.name)}
function fillCats(){document.getElementById("category").innerHTML=cats().map(x=>`<option>${esc(x)}</option>`).join("")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function homeBudget(){return current.homeExpenses.reduce((a,x)=>a+(+x.amount||0),0)}
function homeIncome(){return current.homeIncome.reduce((a,x)=>a+(+x.amount||0),0)}
function cornellaBudget(){return current.apartmentExpenses.reduce((a,x)=>a+(+x.amount||0),0)}
function cornellaIncome(){return current.apartmentIncome.reduce((a,x)=>a+(+x.amount||0),0)}
function monthReal(account){return current.movements.filter(x=>x.account===account&&x.month===current.selectedMonth).reduce((a,x)=>a+x.amount,0)}
function openExpense(){document.getElementById("account").value="Casa";fillCats();document.getElementById("amount").value="";document.getElementById("note").value="";document.getElementById("expenseModal").classList.add("open");setTimeout(()=>document.getElementById("amount").focus(),100)}
function closeExpense(){document.getElementById("expenseModal").classList.remove("open")}
function saveExpense(){let amount=+document.getElementById("amount").value;if(!amount||amount<=0)return toast("Introduce un importe válido");current.movements.push({month:current.selectedMonth,date:new Date().toISOString(),amount,account:document.getElementById("account").value,category:document.getElementById("category").value,note:document.getElementById("note").value.trim()});save();closeExpense();toast("Gasto guardado ✓")}
function finishSetup(){let n=document.getElementById("userName").value.trim()||"Mi casa",a=+document.getElementById("mainIncome").value||0,b=+document.getElementById("otherIncome").value||0;current={...structuredClone(defaults),name:n,homeIncome:[{name:"Ingreso principal",amount:a},{name:"Otros ingresos",amount:b}]};users=[current];save();document.getElementById("setupModal").classList.remove("open")}
function setup(){document.getElementById("setupModal").classList.add("open")}
function render(){if(!current){document.getElementById("app").innerHTML=`<div class="welcome"><div class="welcomeCard"><h1>🏠 Casa Finanzas</h1><p>Controla tus cuentas de casa de forma sencilla. Sin hojas de cálculo, sin contabilidad marciana.</p><button class="blue" onclick="setup()">Crear mi cuenta</button></div></div>`;return}renderHome()}
function renderHome(){let inc=homeIncome(),bud=homeBudget(),real=monthReal("Casa"),cap=inc-bud,ci=cornellaIncome(),cb=cornellaBudget(),cr=monthReal("Cornellà");document.getElementById("app").innerHTML=`
<div class="top"><div><div class="brand">🏠 Casa Finanzas</div><div class="month">${monthLabel(current.selectedMonth)} · ${esc(current.name)}</div></div><button class="primary" onclick="openExpense()">＋ Gasto</button></div>
<div class="cards"><div class="card"><div class="label">💰 Ingresos</div><div class="value">${eur(inc)}</div></div><div class="card"><div class="label">🔴 Gastos previstos</div><div class="value red">${eur(bud)}</div></div><div class="card"><div class="label">🟢 Capacidad de ahorro</div><div class="value green">${eur(cap)}</div></div><div class="card"><div class="label">💳 Gastado real</div><div class="value">${eur(real)}</div></div></div>
<div class="actions"><button class="blue" onclick="openExpense()">＋ Registrar gasto</button><button class="ghost" onclick="changeMonth()">📅 Cambiar mes</button></div>
<div class="grid"><div class="section"><h2>📊 Casa</h2><div class="row"><span>Gastado</span><b>${eur(real)} / ${eur(bud)}</b></div><div class="bar ${real>bud?"redbar":""}"><i style="width:${bud?Math.min(100,real/bud*100):0}%"></i></div><div class="row"><span>Margen disponible</span><b class="${bud-real>=0?"green":"red"}">${eur(bud-real)}</b></div></div>
<div class="section"><h2>🏢 Cornellà · cuenta aparte</h2><div class="row"><span>Alquiler</span><b>${eur(ci)}</b></div><div class="row"><span>Gastos</span><b class="red">${eur(cb)}</b></div><div class="row"><span>Resultado</span><b class="green">${eur(ci-cb)}</b></div><div class="row"><span>Gasto real</span><b>${eur(cr)}</b></div></div></div>
<div class="section" style="margin-top:12px"><h2>💡 Idea clave</h2><div class="small">La aplicación calcula tu capacidad de ahorro. Tú decides cuánto registrar como gasto real. Los presupuestos pueden editarse cuando quieras.</div></div>
<div class="bottom"><div class="bottomin"><button class="nav active" onclick="renderHome()">🏠 Inicio</button><button class="nav" onclick="setup()">⚙️ Configurar</button><button class="nav" onclick="showMovements()">📒 Movimientos</button></div></div>`}
function changeMonth(){let x=prompt("Mes (AAAA-MM)",current.selectedMonth);if(x&&/^\\d{4}-\\d{2}$/.test(x)){current.selectedMonth=x;save()}}
function showMovements(){let rows=current.movements.filter(x=>x.month===current.selectedMonth).slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.category)}</b><div class="small">${x.account} · ${new Date(x.date).toLocaleDateString("es-ES")}${x.note?" · "+esc(x.note):""}</div></div><b>${eur(x.amount)}</b></div>`).join("");document.getElementById("app").innerHTML=`<div class="top"><div><div class="brand">📒 Movimientos</div><div class="month">${monthLabel(current.selectedMonth)}</div></div><button class="blue" onclick="openExpense()">＋ Gasto</button></div><div class="section">${rows||'<div class="muted">No hay movimientos este mes.</div>'}</div><div class="bottom"><div class="bottomin"><button class="nav" onclick="renderHome()">🏠 Inicio</button><button class="nav" onclick="setup()">⚙️ Configurar</button><button class="nav active" onclick="showMovements()">📒 Movimientos</button></div></div>`}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1600)}
render();
</script>
</body></html>
